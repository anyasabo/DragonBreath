name: firmware-build

on:
  push:
    # Fork-only: also build the published branch fork (anyasabo/DragonBreath).
    branches: [main, fork]
    paths:
      - 'components/**'
      - 'main/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.release'
      - 'dependencies.lock'
      - 'sdkconfig.hil-*'
      - 'sdkconfig.debug-*'
      - 'tools/*.py'
      - 'tools/idf-build.sh'
      - '.idf-version'
      - 'tools/elf_check*'
      - 'tools/cppcheck-defs.h'
      - 'tools/sbom/**'
      - 'tools/ci/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'components/**'
      - 'main/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.release'
      - 'dependencies.lock'
      - 'sdkconfig.hil-*'
      - 'sdkconfig.debug-*'
      - 'tools/*.py'
      - 'tools/idf-build.sh'
      - '.idf-version'
      - 'tools/elf_check*'
      - 'tools/cppcheck-defs.h'
      - 'tools/sbom/**'
      - 'tools/ci/**'
  workflow_dispatch:
  # Weekly: new CVEs appear with no change to the code (the SBOM scans).
  schedule:
    - cron: "23 4 * * 1"

# Least-privilege GITHUB_TOKEN: the build only needs to read code and upload
# artifacts (upload-artifact uses the Actions API, not `contents`).
permissions:
  contents: read

# Supersede in-flight builds for the same ref (a push + open PR, or rapid
# pushes) instead of running the ~2 min ESP-IDF build multiple times.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host unit tests: small C programs, no ESP-IDF. The container matches the
  # devspace (Ubuntu 26.10). Each entry builds all tests with one compiler.
  # Ubuntu 26.10 support ends in about July 2027. Move the image (here and in
  # the coverage job) to the new Ubuntu release at each release.
  # ASan and LSan run in the default Docker seccomp profile. If LSan fails
  # with a ptrace error, add `options: --security-opt seccomp=unconfined`.
  host-tests:
    name: host-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ubuntu:26.10@sha256:29ac5e68db830ab61b7d77c1ffdb78c73f0631de88a5d77bf4399868f64f38dd
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc-16
            cflags: ''
          - name: gcc-asan-ubsan
            cc: gcc-16
            cflags: -fsanitize=address,undefined -fno-sanitize-recover=all -g
          - name: clang-asan-ubsan
            cc: clang-23
            cflags: -fsanitize=address,undefined -fno-sanitize-recover=all -g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install compilers
        # clang uses the newest GCC that has libstdc++ headers. Without
        # libstdc++-16-dev, it selects GCC 15 and -Werror stops the build
        # (-Wgcc-install-dir-libstdcxx). Fork-only: git is for the host tests that
        # fetch dc_pid at a commit (tests/fetch_dc_pid.sh). Fork-only: clang-23
        # from apt.llvm.org, the clang of the devspace (tools/ci/install-llvm.sh).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc-16 libstdc++-16-dev libc6-dev
          case "${{ matrix.cc }}" in clang-*) sh tools/ci/install-llvm.sh "${{ matrix.cc }}" ;; esac
          "${{ matrix.cc }}" --version

      - name: Run host tests
        env:
          CC: ${{ matrix.cc }}
          HOST_TEST_CFLAGS: ${{ matrix.cflags }}
        run: sh tests/run_host_tests.sh

  # Line coverage of the host tests (gcc --coverage + gcovr). Report only: no
  # coverage number fails the job.
  coverage:
    runs-on: ubuntu-latest
    container: ubuntu:26.10@sha256:29ac5e68db830ab61b7d77c1ffdb78c73f0631de88a5d77bf4399868f64f38dd
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc-16 libc6-dev pipx

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run host tests with coverage
        # Use a relative path: in a container job, github.workspace is the
        # path on the host, not the path in the container.
        env:
          CC: gcc-16
          HOST_TEST_CFLAGS: --coverage -O0
        run: |
          export TMPDIR="$PWD/coverage-obj"
          mkdir -p "$TMPDIR"
          sh tests/run_host_tests.sh

      - name: Coverage report
        run: |
          mkdir -p coverage-html
          pipx run gcovr==8.8 --gcov-executable gcov-16 \
            --root . --filter 'components/' coverage-obj \
            --txt coverage.txt --html-details coverage-html/index.html
          cat coverage.txt
          {
            echo '## Host test coverage (components/)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-test-coverage
          path: coverage-html/

  # E1 static analysis: cppcheck over OUR OWN code (components/ + main/). Fails on
  # any error/warning/performance/portability finding (--error-exitcode). The C
  # `error` checks are always on. tools/cppcheck-defs.h removes the GNU asm labels
  # on the extern binary-blob symbols, which cppcheck cannot parse. Other false
  # positives are suppressed inline at the site with a justification; the
  # missing-ESP-IDF-headers noise and the normal-check-level branch-limit note are
  # suppressed globally (informational). The container gives a current Cppcheck
  # (2.21 in Ubuntu 26.10); ubuntu-24.04 has 2.13.
  cppcheck:
    runs-on: ubuntu-latest
    container: ubuntu:26.10@sha256:29ac5e68db830ab61b7d77c1ffdb78c73f0631de88a5d77bf4399868f64f38dd
    steps:
      - name: Install cppcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cppcheck
          cppcheck --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static analysis (cppcheck)
        run: |
          INCS=""
          for d in components/*/include; do INCS="$INCS -I$d"; done
          cppcheck \
            --include=tools/cppcheck-defs.h \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --error-exitcode=2 \
            --std=c11 \
            $INCS \
            components/ main/

  build:
    needs: [host-tests]
    runs-on: ubuntu-24.04
    steps:
      # SHA-pinned (supply-chain); trailing comment tracks the human version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read ESP-IDF version
        run: |
          v="$(tr -d '[:space:]' < .idf-version)"
          if ! printf '%s\n' "$v" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error file=.idf-version::'$v' is not an ESP-IDF tag (vX.Y or vX.Y.Z)"
            exit 1
          fi
          echo "IDF_VERSION=$v" >> "$GITHUB_ENV"

      # ccache for the ESP-IDF builds. The espressif/idf image has ccache and sets
      # IDF_CCACHE_ENABLE=1. The esp-idf-ci-action container mounts the
      # workspace, so CCACHE_DIR in the workspace survives the container. Each run
      # saves a new cache and restores the newest one for the same ESP-IDF version.
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ env.IDF_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.IDF_VERSION }}-

      # The host-tests job runs every host test. This step runs the metrics test once
      # more with the prometheus-client parse check, which needs Python and uv.
      - name: Test Prometheus metrics writer (exact text, chunking, prometheus-client parse)
        env:
          METRICS_PARSE: require
        run: |
          command -v uv >/dev/null 2>&1 || pipx install uv
          sh tests/run_metrics_fmt_host_test.sh

      - name: Test HTTP body reads (parts, timeouts, stalled client)
        run: sh tests/run_httpd_body_host_test.sh

      - name: Test HIL scenario runner
        run: python3 -m unittest tests/test_hil_runner.py

      - name: Test network smoke-test tool against a mock API v2 server
        run: python3 -m unittest tests/test_smoke.py

      - name: Test capture, analysis and replay tools
        run: python3 -m unittest tests/test_capture_tools.py

      - name: Test ELF check and RAM treemap tools
        run: python3 -m unittest tests/test_elf_tools.py

      - name: Test JTAG stack sampler (fake OpenOCD)
        run: python3 -m unittest tests/test_jtag_profile.py

      - name: Check script dependencies (PEP 723)
        run: python3 -m unittest tests/test_script_deps.py

      - name: Test the license check of the SBOM tools
        run: python3 -m unittest tests/test_license_check.py

      - name: Test flash.py helpers
        run: python3 -m unittest tests/test_flash_tool.py

      # E1 warnings-as-errors: enforced inside the build itself — the top-level
      # CMakeLists applies `-Wall -Wextra -Werror` PRIVATE to every first-party pb_*
      # and db_* component (never to ESP-IDF's own code). The default + HIL builds here and
      # the release build in release.yml all fail on any warning in our components
      # (verified clean under default AND sdkconfig.release).
      #
      # E1 dependency-lock validation is NOT a git-diff gate here. The fork commits
      # `dependencies.lock`, but the lock records the ESP-IDF version of the local
      # build. If the CI ESP-IDF version is different, the build solves again and
      # writes a new lock. The pins in main/idf_component.yml are commit hashes.
      - name: Build (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: ccache --zero-stats && idf.py build

      # SBOM, license check and vulnerability scans: tools/sbom/sbom.sh, the same script as
      # local runs. "create" is offline and reads build/project_description.json, which has
      # the container paths, so it runs in the ESP-IDF container. A license failure fails the
      # build. "scan" sends the NVD requests: it only reports, in the job summary.
      - name: Create SBOM and check licenses
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          command: sh tools/sbom/sbom.sh create build build/sbom

      # NVD++ runs only if the repository has the secret VULNCHECK_TOKEN (a free VulnCheck
      # community token). It finds CVEs that NVD has not analysed yet.
      - name: Scan SBOM for vulnerabilities (report only)
        continue-on-error: true
        timeout-minutes: 30
        env:
          VULNCHECK_TOKEN: ${{ secrets.VULNCHECK_TOKEN }}
          # Optional: an NVD API key makes esp-idf-sbom check faster.
          NVDAPIKEY: ${{ secrets.NVDAPIKEY }}
        run: |
          sudo sh tools/ci/install-scanners.sh
          sudo chown -R "$(id -u)" build/sbom
          sh tools/sbom/sbom.sh scan build/sbom
          if [ -n "$VULNCHECK_TOKEN" ]; then
            sh tools/sbom/sbom.sh nvdpp build/sbom
          else
            printf '## NVD++\n\n- Not run: the secret VULNCHECK_TOKEN is not set.\n' >> build/sbom/summary.md
          fi
          cat build/sbom/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dragonbreath-sbom
          path: |
            build/sbom/*
            !build/sbom/.venv

      - name: Check API v2 contract and shared dashboard ownership
        run: |
          sh tests/check_api_v2_contract.sh

      - name: Check that the production build enforces the first-heat check
        run: sh tests/check_first_heat_enforced.sh build

      # Static checks on the release ELF: the calls that the control task can
      # reach (log, printf, soft double, blocking, malloc) against the allowlist,
      # the worst-case stack of each task (-fstack-usage), and a RAM treemap.
      - name: Static ELF checks on the release profile (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: |
            set -e
            idf.py -B build-release-check \
              -DSDKCONFIG="$PWD/build-release-check/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" \
              -DDB_STACK_USAGE=ON \
              build
            python3 tools/elf_check.py --ci --stack \
              --allowlist tools/elf_check_allowlist.txt \
              build-release-check/dragonbreath.elf
            python3 tools/ram_treemap.py --top 30 \
              -o build-release-check/ram-treemap.svg \
              build-release-check/dragonbreath.map

      - name: Build safe dev-board HIL profile (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: |
            set -e   # a failed idf.py must fail the step, not be masked by the next command
            idf.py -B build-hil-devboard \
              -DSDKCONFIG="$PWD/build-hil-devboard/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hil-devboard" \
              build
            sh tests/check_hil_compileout.sh build-hil-devboard
            idf.py -B build-hil-devboard-uart \
              -DSDKCONFIG="$PWD/build-hil-devboard-uart/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hil-devboard-uart" \
              build
            sh tests/check_hil_compileout.sh build-hil-devboard-uart

      - name: Build native-USB production-network debug profile (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: |
            set -e
            idf.py -B build-debug-devboard-native \
              -DSDKCONFIG="$PWD/build-debug-devboard-native/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.debug-devboard-native" \
              build
            sh tests/check_devboard_compileout.sh build-debug-devboard-native
            ccache --show-stats   # hit rate of all builds in this job

      # Report only: DB_EXTRA_WARNINGS adds -Wdouble-promotion, -Wshadow, -Wformat=2,
      # -Wundef and -Wstrict-prototypes as warnings, not errors. The job summary shows
      # the count for each flag. This step does not fail the job.
      - name: Build with extra warnings (report only)
        continue-on-error: true
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: |
            set -eo pipefail
            idf.py -B build-extra-warnings \
              -DSDKCONFIG="$PWD/build-extra-warnings/sdkconfig.profile" \
              -DDB_EXTRA_WARNINGS=ON \
              build 2>&1 | tee build-extra-warnings.log

      - name: Count extra warnings
        continue-on-error: true
        run: |
          {
            echo '## Extra warnings (DB_EXTRA_WARNINGS=ON)'
            echo 'Unique locations. "ESP-IDF" counts warnings in ESP-IDF headers that first-party code includes.'
            echo
            echo '| flag | first-party | dragon-core | ESP-IDF |'
            echo '|---|---:|---:|---:|'
            sed -nE '/^[^ :]+:[0-9]+:[0-9]+: warning: .*\[-W[^]]+\]$/p' build-extra-warnings.log | sort -u |
              awk '{
                flag = $NF; gsub(/[][]/, "", flag); src = $1
                if (src ~ /managed_components\//) o = 2
                else if (src ~ /\/esp-idf\/|^\/opt\/esp\/idf\//) o = 3
                else o = 1
                n[flag, o]++; f[flag] = 1
              } END {
                for (k in f) printf "| `%s` | %d | %d | %d |\n", k, n[k, 1], n[k, 2], n[k, 3]
              }' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dragonbreath-firmware
          path: |
            build/dragonbreath.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build-hil-devboard/dragonbreath.bin
            build-hil-devboard-uart/dragonbreath.bin
            build-debug-devboard-native/dragonbreath.bin
            build-release-check/ram-treemap.svg
          if-no-files-found: warn

  # Fork-only: the fork builds with the ESP-IDF in .idf-version (v6.1.x). This
  # separate job checks that the code still builds with ESP-IDF v5.3, because
  # the upstream v6 PRs must keep v5.3 working. A failure here does not stop the
  # main build and its artifact upload.
  build-idf5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CMakeLists.txt keeps the lock of another ESP-IDF version in the build
      # directory, so this build does not use the v6.1 dependencies.lock.
      - name: Build release profile (ESP-IDF v5.3.6)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.3.6
          target: esp32c3
          path: '.'
          command: |
            set -e
            idf.py -B build-idf5-release \
              -DSDKCONFIG="$PWD/build-idf5-release/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" \
              build
