name: firmware-build

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'main/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.hil-*'
      - 'sdkconfig.debug-*'
      - 'tools/hil.py'
      - 'tools/idf-build.sh'
      - '.idf-version'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'components/**'
      - 'main/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.hil-*'
      - 'sdkconfig.debug-*'
      - 'tools/hil.py'
      - 'tools/idf-build.sh'
      - '.idf-version'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: the build only needs to read code and upload
# artifacts (upload-artifact uses the Actions API, not `contents`).
permissions:
  contents: read

# Supersede in-flight builds for the same ref (a push + open PR, or rapid
# pushes) instead of running the ~2 min ESP-IDF build multiple times.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host unit tests: small C programs, no ESP-IDF. The container matches the
  # devspace (Ubuntu 26.10). Each entry builds all tests with one compiler.
  # Ubuntu 26.10 support ends in about July 2027. Move the image (here and in
  # the coverage job) to the new Ubuntu release at each release.
  # ASan and LSan run in the default Docker seccomp profile. If LSan fails
  # with a ptrace error, add `options: --security-opt seccomp=unconfined`.
  host-tests:
    name: host-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc-16
            cflags: ''
          - name: gcc-asan-ubsan
            cc: gcc-16
            cflags: -fsanitize=address,undefined -fno-sanitize-recover=all -g
          - name: clang-asan-ubsan
            cc: clang
            cflags: -fsanitize=address,undefined -fno-sanitize-recover=all -g
    steps:
      - name: Install compilers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc-16 clang libclang-rt-dev libc6-dev
          "${{ matrix.cc }}" --version

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run host tests
        env:
          CC: ${{ matrix.cc }}
          HOST_TEST_CFLAGS: ${{ matrix.cflags }}
        run: sh tests/run_host_tests.sh

  # Line coverage of the host tests (gcc --coverage + gcovr). Report only: no
  # coverage number fails the job.
  coverage:
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc-16 libc6-dev pipx

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run host tests with coverage
        # Use a relative path: in a container job, github.workspace is the
        # path on the host, not the path in the container.
        env:
          CC: gcc-16
          HOST_TEST_CFLAGS: --coverage -O0
        run: |
          export TMPDIR="$PWD/coverage-obj"
          mkdir -p "$TMPDIR"
          sh tests/run_host_tests.sh

      - name: Coverage report
        run: |
          mkdir -p coverage-html
          pipx run gcovr==8.8 --gcov-executable gcov-16 \
            --root . --filter 'components/' coverage-obj \
            --txt coverage.txt --html-details coverage-html/index.html
          cat coverage.txt
          {
            echo '## Host test coverage (components/)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-test-coverage
          path: coverage-html/

  build:
    needs: [host-tests]
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (supply-chain); trailing comment tracks the human version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read ESP-IDF version
        run: |
          v="$(tr -d '[:space:]' < .idf-version)"
          if ! printf '%s\n' "$v" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error file=.idf-version::'$v' is not an ESP-IDF tag (vX.Y or vX.Y.Z)"
            exit 1
          fi
          echo "IDF_VERSION=$v" >> "$GITHUB_ENV"

      # ccache for the ESP-IDF builds. The espressif/idf image has ccache and sets
      # IDF_CCACHE_ENABLE=1. The esp-idf-ci-action container mounts the
      # workspace, so CCACHE_DIR in the workspace survives the container. Each run
      # saves a new cache and restores the newest one for the same ESP-IDF version.
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ env.IDF_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.IDF_VERSION }}-

      # The host-tests job runs every host test. This step runs the metrics test once
      # more with the prometheus-client parse check, which needs Python and uv.
      - name: Test Prometheus metrics writer (exact text, chunking, prometheus-client parse)
        env:
          METRICS_PARSE: require
        run: |
          command -v uv >/dev/null 2>&1 || pipx install uv
          sh tests/run_metrics_fmt_host_test.sh

      - name: Test HIL scenario runner
        run: python3 -m unittest tests/test_hil_runner.py

      # E1 static analysis: cppcheck over OUR OWN code (components/ + main/). Fails on
      # any error/warning/performance/portability finding (--error-exitcode). The C
      # `error` checks are always on. False positives cppcheck's parser cannot model
      # (e.g. GNU asm() labels on extern binary-blob symbols) are suppressed inline
      # at the site with a justification; the missing-ESP-IDF-headers noise and the
      # normal-check-level branch-limit note are suppressed globally (informational).
      - name: Static analysis (cppcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version
          INCS=""
          for d in components/*/include; do INCS="$INCS -I$d"; done
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --error-exitcode=2 \
            --std=c11 \
            $INCS \
            components/ main/

      # E1 warnings-as-errors: enforced inside the build itself — the top-level
      # CMakeLists applies `-Wall -Wextra -Werror` PRIVATE to every first-party pb_*
      # and db_* component (never to ESP-IDF's own code). The default + HIL builds here and
      # the release build in release.yml all fail on any warning in our components
      # (verified clean under default AND sdkconfig.release).
      #
      # E1 dependency-lock validation is intentionally NOT a git-diff gate here:
      # `dependencies.lock` is .gitignored (generated, not version-controlled), so
      # there is no committed lock to drift. The ESP-IDF build step re-solves and
      # validates the managed-component dependencies against the pinned manifests
      # (components/*/idf_component.yml) on every run, which is the validation.
      - name: Build (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: ccache --zero-stats && idf.py build

      # SBOM: esp-idf-sbom reads build/project_description.json. That file has the
      # container paths, so the create step runs in the ESP-IDF container. The
      # vulnerability check needs only the SPDX file. It reports and does not fail.
      - name: Create SBOM (SPDX)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          command: |
            set -e
            pip install --quiet esp-idf-sbom==1.5.0
            esp-idf-sbom create --rem-unused -o build/dragonbreath.spdx build/project_description.json

      - name: Check SBOM for vulnerabilities (report only)
        continue-on-error: true
        timeout-minutes: 20
        env:
          NVDAPIKEY: ${{ secrets.NVDAPIKEY }}
        run: |
          # check exits 1 if it finds a CVE. Keep the code for the summary.
          rc=0
          pipx run esp-idf-sbom==1.5.0 --no-color --no-progress --no-hint \
            check --format markdown -o build/sbom-check.md build/dragonbreath.spdx || rc=$?
          {
            echo '## SBOM vulnerability check (report only)'
            echo
            echo "esp-idf-sbom check exit code: $rc"
            echo
            echo '| status | severity | package | version | CVE |'
            echo '|---|---|---|---|---|'
            sed 's/  */ /g' build/sbom-check.md | awk -F'|' '$5 ~ /CVE-/ {
              for (i = 2; i <= 7; i++) gsub(/^ +| +$/, "", $i)
              printf "| %s | %s | %s | %s | %s |\n", $2, ($7 == "" ? "-" : $7), $3, $4, $5
            }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragonbreath-sbom
          path: |
            build/dragonbreath.spdx
            build/sbom-check.md
          if-no-files-found: warn

      - name: Check API v2 contract and shared dashboard ownership
        run: |
          sh tests/check_api_v2_contract.sh

      - name: Build safe dev-board HIL profile (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: |
            set -e   # a failed idf.py must fail the step, not be masked by the next command
            idf.py -B build-hil-devboard \
              -DSDKCONFIG="$PWD/build-hil-devboard/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hil-devboard" \
              build
            sh tests/check_hil_compileout.sh build-hil-devboard
            idf.py -B build-hil-devboard-uart \
              -DSDKCONFIG="$PWD/build-hil-devboard-uart/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hil-devboard-uart" \
              build
            sh tests/check_hil_compileout.sh build-hil-devboard-uart

      - name: Build native-USB production-network debug profile (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: |
            set -e
            idf.py -B build-debug-devboard-native \
              -DSDKCONFIG="$PWD/build-debug-devboard-native/sdkconfig.profile" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.debug-devboard-native" \
              build
            sh tests/check_devboard_compileout.sh build-debug-devboard-native
            ccache --show-stats   # hit rate of all builds in this job

      # Report only: DB_EXTRA_WARNINGS adds -Wdouble-promotion, -Wshadow, -Wformat=2,
      # -Wundef and -Wstrict-prototypes as warnings, not errors. The job summary shows
      # the count for each flag. This step does not fail the job.
      - name: Build with extra warnings (report only)
        continue-on-error: true
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          extra_docker_args: >-
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
          command: |
            set -eo pipefail
            idf.py -B build-extra-warnings \
              -DSDKCONFIG="$PWD/build-extra-warnings/sdkconfig.profile" \
              -DDB_EXTRA_WARNINGS=ON \
              build 2>&1 | tee build-extra-warnings.log

      - name: Count extra warnings
        continue-on-error: true
        run: |
          {
            echo '## Extra warnings (DB_EXTRA_WARNINGS=ON)'
            echo 'Unique locations. "ESP-IDF" counts warnings in ESP-IDF headers that first-party code includes.'
            echo
            echo '| flag | first-party | dragon-core | ESP-IDF |'
            echo '|---|---:|---:|---:|'
            sed -nE '/^[^ :]+:[0-9]+:[0-9]+: warning: .*\[-W[^]]+\]$/p' build-extra-warnings.log | sort -u |
              awk '{
                flag = $NF; gsub(/[][]/, "", flag); src = $1
                if (src ~ /managed_components\//) o = 2
                else if (src ~ /\/esp-idf\/|^\/opt\/esp\/idf\//) o = 3
                else o = 1
                n[flag, o]++; f[flag] = 1
              } END {
                for (k in f) printf "| `%s` | %d | %d | %d |\n", k, n[k, 1], n[k, 2], n[k, 3]
              }' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragonbreath-firmware
          path: |
            build/dragonbreath.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build-hil-devboard/dragonbreath.bin
            build-hil-devboard-uart/dragonbreath.bin
            build-debug-devboard-native/dragonbreath.bin
          if-no-files-found: warn
