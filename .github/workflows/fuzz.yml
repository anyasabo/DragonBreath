name: fuzz

# Fuzzing takes a few minutes, so it does not run on each push.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"   # each Monday

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    # Run each libFuzzer harness of the HTTP handlers for 120 s. If a harness
    # finds a crash or a broken invariant, the job fails and uploads the input.
    # The same container as the host tests: a current clang, not the clang-18
    # of the ubuntu-latest runner.
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    steps:
      # libFuzzer and the sanitizer runtimes are in libclang-rt-dev. With
      # --no-install-recommends, apt does not install it with clang. clang
      # needs the libstdc++ headers of the newest GCC (see firmware-build.yml).
      - name: Install clang
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang libclang-rt-dev gcc-16 libstdc++-16-dev libc6-dev
          clang --version

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fuzz the HTTP handlers
        run: tests/run_fuzz.sh 120

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: /tmp/dragonbreath-fuzz/artifacts-*
