name: fuzz

# Fuzzing takes a few minutes, so it does not run on each push.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"   # each Monday

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    # Run each libFuzzer harness of the HTTP handlers for 120 s. If a harness
    # finds a crash or a broken invariant, the job fails and uploads the input.
    runs-on: ubuntu-latest
    steps:
      # libFuzzer and the sanitizer runtimes are in libclang-rt-dev. With
      # --no-install-recommends, apt does not install it with clang.
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-dev

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fuzz the HTTP handlers
        run: tests/run_fuzz.sh 120

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: /tmp/dragonbreath-fuzz/artifacts-*
