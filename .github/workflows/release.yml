name: firmware-release

# Cut a reproducible release from a tag (Phase 0.2). Pushing a tag like v0.2.0
# builds the firmware in CI and publishes a GitHub Release with a single-file
# first-install image, the OTA app image, a complete install bundle, a provenance
# manifest, and SHA-256 checksums. workflow_dispatch produces a DRAFT for dry runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least-privilege: only the release job needs write, to create the Release.
permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-publish

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read ESP-IDF version
        run: |
          v="$(tr -d '[:space:]' < .idf-version)"
          if ! printf '%s\n' "$v" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error file=.idf-version::'$v' is not an ESP-IDF tag (vX.Y or vX.Y.Z)"
            exit 1
          fi
          echo "IDF_VERSION=$v" >> "$GITHUB_ENV"

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            V="$(git describe --tags --always --dirty)"
          fi
          echo "version=$V" | tee -a "$GITHUB_OUTPUT"

      - name: Run host tests
        run: sh tests/run_host_tests.sh

      - name: Build (ESP-IDF ${{ env.IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          # Release builds layer sdkconfig.release on top of the defaults to enable
          # CONFIG_PB_POWER_LED (drives the front-panel Power LED on GPIO21, giving up
          # console TX). Dev builds (plain `idf.py build`) omit it and keep the console.
          command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build

      - name: Create SBOM (SPDX)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: '.'
          command: |
            set -e
            pip install --quiet esp-idf-sbom==1.5.0
            esp-idf-sbom create --rem-unused -o build/dragonbreath.spdx build/project_description.json

      - name: Check that the release enforces the first-heat check
        run: sh tests/check_first_heat_enforced.sh build

      - name: Package release artifacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # esptool for the merged factory image (script falls back to python -m esptool)
          pipx install esptool >/dev/null 2>&1 \
            || pip install --user esptool \
            || pip install --user --break-system-packages esptool
          export PATH="$HOME/.local/bin:$PATH"
          ./tools/package_release.sh
          # SBOM and component lock: published next to the app image. The publish step hashes them.
          cp build/dragonbreath.spdx "dist/dragonbreath-${VERSION}.spdx"
          cp dependencies.lock dist/dependencies.lock

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          # Pull this version's section from CHANGELOG.md (## [x.y.z] .. next ## [).
          changelog="$(awk -v v="${VERSION#v}" '
            $0 ~ ("^## \\[" v "\\]") {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md 2>/dev/null || true)"
          install="$(cat <<EOF
          **Install (no USB — recommended):** on the stock Panda web UI ("Firmware Update"), upload \`dragonbreath-${VERSION}.bin\`. It installs as an app through the stock firmware's own OTA — the stock bootloader/partitions stay in place, so you can revert to Panda later over WiFi.
          **Update / revert (already on DragonBreath):** upload \`dragonbreath-${VERSION}.bin\` via \`/fw\`; to return to Panda, upload your stock backup's **app** image via \`/fw\`.
          **Recovery only (USB):** from a source checkout, \`uv run tools/flash.py\` (backs up stock first). The full/factory image is not published — build it locally if you need it.

          > **Alpha/beta testers:** if your unit was USB-flashed, **restore your stock backup first, then install this via the stock updater** — a stock-layout install can't be reached by OTA from a native-layout one.

          | asset | purpose |
          |---|---|
          | \`dragonbreath-${VERSION}.bin\` | application image — install via stock's OTA, or update/revert via \`/fw\` |
          | \`manifest.json\` | provenance (source SHA, ESP-IDF, vendored-core) + per-artifact SHA-256 |
          | \`SHA256SUMS.txt\` | \`sha256sum -c SHA256SUMS.txt\` |
          | \`dragonbreath-${VERSION}.spdx\` | SBOM (SPDX 2.2) of the components linked into the image |
          | \`dependencies.lock\` | exact versions of the managed components (dragon-core and others) |
          EOF
          )"
          if [ -n "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]; then
            notes="${changelog}"$'\n\n'"${install}"
          else
            notes="$install"
          fi
          # Title = just the version, so the GitHub Releases left-nav (which truncates)
          # shows the version instead of a row of identical "DragonBreath firmw…".
          flags=(--title "${VERSION}" --notes "$notes")
          [ "$IS_TAG" = "true" ] || flags+=(--draft)
          case "$VERSION" in *alpha*|*beta*|*rc*) flags+=(--prerelease);; esac
          # App-only release: the OTA app image is the product. The factory image
          # + install bundle are still built (recovery/dev machinery stays in the
          # repo) but no longer published — install/revert is app-only over stock OTA.
          # SHA256SUMS.txt lists exactly the published assets in this list.
          assets=("dragonbreath-${VERSION}.bin" manifest.json "dragonbreath-${VERSION}.spdx" dependencies.lock)
          ( cd dist && sha256sum "${assets[@]}" > SHA256SUMS.txt )
          gh release create "$VERSION" "${flags[@]}" \
            "${assets[@]/#/dist/}" \
            dist/SHA256SUMS.txt
